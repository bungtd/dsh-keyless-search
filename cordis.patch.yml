# dsh-keyless-search bundle layer.
#
# Registers a web-search provider that needs NO API key. It chains several
# independent public backends so one endpoint being down or rate-limited never
# breaks search: the first backend that answers wins.
#
# The `web` row's whole `config` block is REPLACED by this patch, so every field
# the base bundle sets is restated: dropping `fetchProvider: http` would leave two
# usable fetch providers registered (deepseek-fetch-api + http) and every web_fetch
# would fail with WEB_PROVIDER_AMBIGUOUS.
- insert:
    - id: keyless-search
      name: 'dsh-keyless-search'
      config:
        # Measured order, not a permanent ranking: public endpoints drift, and
        # within 17 hours WebCrawler went from best to IP-blocked while Exa and
        # Parallel recovered from a multi-day 429. Re-check with
        # `node scripts/probe.mjs` and move what recovered ahead of what broke.
        #
        # mwmbl/exa/parallel are the fast, reliable general engines; wikipedia is
        # quota-free; tinyfish sits late because its guest tier is only 50
        # searches/day per network; lumy is a slow meta-searcher; webcrawler is
        # currently blocked but kept in case it lifts. Add mdn, npm, arxiv, or
        # googlenews to include topic-specific sources in the automatic path.
        backends:
          - mwmbl
          - exa
          - parallel
          - wikipedia
          - tinyfish
          - hackernews
          - lumy
          - webcrawler
        timeoutMs: 20000
        maxResults: 10

- id: web
  config:
    searchProvider: keyless-mcp
    fetchProvider: http
